<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUJAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#0a0e14; color:#00ff88; font-family:'Courier New', monospace; }
        .header { 
            background:#161b22; 
            padding:30px; 
            text-align:center; 
            font-size:36px; 
            border-bottom:5px solid #00ff88;
            animation: breathe 4s infinite ease-in-out;
        }
        @keyframes breathe { 0%,100% { opacity:1; } 50% { opacity:0.92; } }

        .card { background:rgba(0,255,0,0.08); border:2px solid #00ff88; border-radius:16px; }
        input, textarea { background:#111; color:#00ff88; border:1px solid #00ff88; }
        
        .console { 
            height: 420px; 
            background:#000; 
            border:3px solid #ffcc00; 
            padding:20px; 
            overflow-y:auto; 
            font-size:15.5px; 
            line-height:1.65; 
            color:#ffcc00;
            box-shadow:0 0 30px #ffcc00;
        }
        
        .btn-start { background:#00ff88; color:#000; font-weight:bold; font-size:23px; box-shadow:0 0 35px #00ff88; }
        .btn-start:hover { transform:scale(1.07); box-shadow:0 0 55px #00ff88; }
        .btn-stop { background:#ff3366; color:white; font-weight:bold; font-size:23px; }
        
        .nav-link { color:#00ff88; }
        .nav-link.active { color:#ffcc00; border-bottom:3px solid #ffcc00; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="header">SUJAL</div>

    <ul class="nav nav-tabs justify-content-center mt-4">
        <li class="nav-item"><a class="nav-link active" onclick="openTab(0)">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" onclick="openTab(1)">Messages</a></li>
        <li class="nav-item"><a class="nav-link" onclick="openTab(2)">Settings</a></li>
    </ul>

    <!-- Dashboard -->
    <div class="tab-content active card p-4 mt-3" id="tab0">
        <div class="text-center mb-4">
            <span id="status" class="badge fs-3 px-5 py-3">STOPPED</span>
        </div>
        <div class="d-grid gap-3">
            <button onclick="startBomb()" class="btn btn-start">▶ START BOT</button>
            <button onclick="stopBomb()" class="btn btn-stop">⛔ STOP BOT</button>
        </div>
        <div class="mt-4 text-center">
            <small>Sent: <span id="sent" class="fw-bold">0</span> | 
                   Uptime: <span id="uptime">00:00:00</span></small>
        </div>
    </div>

    <!-- Messages -->
    <div class="tab-content card p-4 mt-3" id="tab1">
        <form id="form">
            <div class="mb-3">
                <label class="form-label">Session ID (Optional)</label>
                <textarea name="sessionid" class="form-control" rows="2" placeholder="sessionid paste karo"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Messages (Pura spam yahan likho - Ye ek hi message banega)</label>
                <textarea name="messages" class="form-control" rows="14" placeholder="Apna pura formatted spam message yahan likho..." required></textarea>
            </div>
        </form>
    </div>

    <!-- Settings -->
    <div class="tab-content card p-4 mt-3" id="tab2">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Message Delay (seconds) - Messages ke beech</label>
                <input name="delay" type="number" step="0.1" class="form-control" value="25">
            </div>
            <div class="col-md-6">
                <label class="form-label">Cycle (Har kitne messages ke baad Name Change + Break)</label>
                <input name="cycle" type="number" class="form-control" value="35">
            </div>
            <div class="col-md-6">
                <label class="form-label">Break Duration (seconds) - Cycle ke baad</label>
                <input name="break_sec" type="number" class="form-control" value="40" min="10" max="60">
            </div>
            <div class="col-md-6">
                <label class="form-label">Group Switch Delay (seconds) - GC change karte waqt</label>
                <input name="group_delay" type="number" class="form-control" value="5" min="3" max="15">
            </div>
            <div class="col-md-12">
                <label class="form-label">Group Name Base (Name Change ke liye)</label>
                <input name="group_name" type="text" class="form-control" placeholder="SUJAL">
            </div>
        </div>
    </div>

    <!-- Live Console -->
    <div class="card p-4 mt-4">
        <h5 class="text-center mb-3">LIVE CONSOLE</h5>
        <div id="console" class="console"></div>
    </div>
</div>

<script>
function openTab(n) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('tab'+n).classList.add('active');
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-link')[n].classList.add('active');
}

function updateStatus() {
    fetch("/status").then(r => r.json()).then(d => {
        document.getElementById("sent").innerText = d.sent;
        document.getElementById("uptime").innerText = d.uptime;
        
        const statusEl = document.getElementById("status");
        if (d.running) {
            statusEl.innerText = "RUNNING";
            statusEl.className = "badge bg-danger fs-3 px-5 py-3 status-running";
        } else {
            statusEl.innerText = "STOPPED";
            statusEl.className = "badge bg-secondary fs-3 px-5 py-3";
        }

        document.getElementById("console").innerHTML = d.logs.map(l => `<div>${l}</div>`).join("");
        document.getElementById("console").scrollTop = 999999;
    });
}

function startBomb() {
    const form = document.getElementById("form");
    fetch("/start", { method: "POST", body: new FormData(form) })
        .then(() => updateStatus());
}

function stopBomb() {
    fetch("/stop", { method: "POST" }).then(() => updateStatus());
}

setInterval(updateStatus, 1400);
updateStatus();
</script>
</body>
</html>
